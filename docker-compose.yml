services:
  caddy:
    image: caddy:2-alpine
    container_name: lms_caddy
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD}@db:5432/lms_by_module
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - lms_uploads:/data/uploads
      - lms_backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: lms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lms_by_module
    volumes:
      - lms_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_by_module"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lms_db:
    driver: local
  lms_uploads:
    driver: local
  lms_backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
